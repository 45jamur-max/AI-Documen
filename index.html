    <meta name="description" content="Aplikasi konversi gambar, screenshot, dan hasil scan dokumen ke format Excel (.xlsx), Word (.docx), dan PDF siap edit menggunakan teknologi AI Gemini." />
    <meta property="og:title" content="AI Converter — Gambar ke Excel, Word &amp; PDF" />
    <meta property="og:description" content="Aplikasi konversi gambar, screenshot, dan hasil scan dokumen ke format Excel (.xlsx), Word (.docx), dan PDF siap edit menggunakan teknologi AI Gemini." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="AI Converter" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var NativeWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isHmr = protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1 || url.indexOf('/@vite/') !== -1));
            if (isHmr) {
              var emitter = new EventTarget();
              return {
                url: String(url),
                readyState: 1, // WebSocket.OPEN
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                binaryType: 'blob',
                bufferedAmount: 0,
                protocol: 'vite-hmr',
                send: function() {},
                close: function() { this.readyState = 3; },
                addEventListener: function(t, l, o) { emitter.addEventListener(t, l, o); },
                removeEventListener: function(t, l, o) { emitter.removeEventListener(t, l, o); },
                dispatchEvent: function(e) { return emitter.dispatchEvent(e); }
              };
            }
            return new NativeWS(url, protocols);
          };
          window.WebSocket.prototype = NativeWS.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var origConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) {
            return a && (a.stack || a.message || String(a));
          }).join(' ');
          if (
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('WebSocket closed without opened') !== -1 ||
            (args[0] === '[vite]' && str.indexOf('WebSocket') !== -1)
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function (e) {
          var msg = e && (e.message || (e.error && (e.error.stack || e.error.message)) || '');
          if (
            typeof msg === 'string' &&
            (msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
              msg.indexOf('[vite]') !== -1 ||
              msg.indexOf('WebSocket') !== -1)
          ) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && (e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : '');
          if (
            typeof reason === 'string' &&
            (reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
              reason.indexOf('[vite]') !== -1 ||
              reason.indexOf('WebSocket') !== -1)
          ) {
            e.preventDefault && e.preventDefault();
            e.stopImmediatePropagation && e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
