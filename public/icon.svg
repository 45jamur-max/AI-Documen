<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Squircle Base (Android App Icon style) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Document Card with shadow -->
  <g filter="url(#shadow)">
    <rect x="110" y="90" width="230" height="310" rx="20" fill="url(#docGrad)" />
    <!-- Folded corner / document lines -->
    <rect x="140" y="140" width="100" height="14" rx="7" fill="#94a3b8" />
    <rect x="140" y="170" width="160" height="12" rx="6" fill="#cbd5e1" />
    <rect x="140" y="196" width="140" height="12" rx="6" fill="#cbd5e1" />
    
    <!-- Mini Spreadsheet Grid inside doc -->
    <rect x="140" y="226" width="170" height="85" rx="8" fill="#e2e8f0" />
    <line x1="140" y1="254" x2="310" y2="254" stroke="#94a3b8" stroke-width="2" />
    <line x1="140" y1="282" x2="310" y2="282" stroke="#cbd5e1" stroke-width="2" />
    <line x1="196" y1="226" x2="196" y2="311" stroke="#cbd5e1" stroke-width="2" />
    <line x1="252" y1="226" x2="252" y2="311" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- AI Sparkle Badge & Transformation Arrow -->
  <circle cx="350" cy="350" r="75" fill="#10b981" filter="url(#shadow)" />
  
  <!-- AI Sparkle in Circle -->
  <path d="M350 305 L356 335 L386 341 L356 347 L350 377 L344 347 L314 341 L344 335 Z" fill="#ffffff" />
  <circle cx="376" cy="316" r="5" fill="#fef08a" />
  <circle cx="324" cy="366" r="4" fill="#fef08a" />
  
  <!-- Badge Labels for Formats -->
  <g font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" text-anchor="middle">
    <!-- Excel green badge -->
    <rect x="90" y="380" width="80" height="38" rx="8" fill="#16a34a" />
    <text x="130" y="408" fill="#ffffff" font-size="20">XLSX</text>
    
    <!-- Word blue badge -->
    <rect x="180" y="380" width="80" height="38" rx="8" fill="#2563eb" />
    <text x="220" y="408" fill="#ffffff" font-size="20">DOCX</text>
    
    <!-- PDF red badge -->
    <rect x="270" y="380" width="70" height="38" rx="8" fill="#dc2626" />
    <text x="305" y="408" fill="#ffffff" font-size="20">PDF</text>
  </g>
</svg>
